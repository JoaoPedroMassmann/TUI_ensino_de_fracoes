[project]
name = "fracoes"
version = "0.1.0"
description = "Sistema educativo de frações com peças físicas, tags ArUco e áudio"
requires-python = ">=3.9"
dependencies = ["opencv-contrib-python>=4.7", "numpy", "Pillow", "pyttsx3"]

[project.scripts]
fracoes = "fracoes.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fracoes"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
